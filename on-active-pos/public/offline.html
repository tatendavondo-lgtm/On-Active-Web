<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | On Active POS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A0A;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-w-md;
      padding: 2rem;
      border: 1px solid #27272A;
      background-color: #121212;
      border-radius: 12px;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #A1A1AA; line-height: 1.5; font-size: 0.95rem; }
    .icon { font-size: 3rem; margin-bottom: 1rem; color: #F59E0B; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #FAFAFA;
      color: #0A0A0A;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔌</div>
    <h1>You're Offline</h1>
    <p>The On Active POS continues to work seamlessly without an internet connection.</p>
    <p>All your transactions are saved locally and will automatically sync once your connection is restored.</p>
    <button onclick="window.location.reload()">Refresh App</button>
  </div>
</body>
</html>
